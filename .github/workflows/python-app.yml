name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  merge_group:
    branches: [ master ]
jobs:
  linting:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.12.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: pre-commit run --all-files

      - name: Test with Redis and Docker
        run: |
          cp config.template.py config.py
          export DOCKER_VOLUME_PATH="$RUNNER_TEMP/tango-volumes/"
          mkdir -p "$DOCKER_VOLUME_PATH"
          docker build -f vmms/Dockerfile -t autograding_image .
          python -m unittest discover -s tests
